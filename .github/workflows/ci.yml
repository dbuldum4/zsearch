name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pyte (terminal emulator for end-to-end tests)
        run: pip install pyte
      - name: Install poppler (pdftotext)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test --timeout 120000
      - uses: actions/upload-artifact@v4
        with:
          name: zsearch-${{ runner.os }}-${{ runner.arch }}
          path: dist/zsearch
