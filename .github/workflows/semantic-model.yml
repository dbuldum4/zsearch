name: Search by meaning (real model)

# Runs search by meaning with the real EmbeddingGemma 2 model on a Mac: what 8-bit vectors cost
# in results against 16-bit ones, whether packing passages together changes them
# (scripts/bench-semantic/quality.ts, which fails the job past its limits), and how long indexing
# takes against DigUp's way (scripts/bench-semantic/bench.ts, informational). The model is
# downloaded from Hugging Face with its checksum checked, once, and kept in the cache until
# src/semantic/model.ts pins another.

on:
  pull_request:
    paths:
      - "src/semantic/**"
      - "native/embed/**"
      - "scripts/build-embed.sh"
      - "scripts/bench-semantic/**"
      - ".github/workflows/semantic-model.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-model-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-model:
    runs-on: macos-latest
    env:
      ZSEARCH_MODELS: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/zsearch-embed
          key: zsearch-embed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/embed/**', 'scripts/build-embed.sh') }}
      - name: Build the embedding helper
        run: '[ -x dist/zsearch-embed ] || scripts/build-embed.sh'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .models
          key: embeddinggemma-${{ hashFiles('src/semantic/model.ts') }}
      - name: Download the model (text part)
        run: bun src/cli.ts semantic install --no-images
        env:
          ZSEARCH_HOME: ${{ runner.temp }}/zsearch-home
      - name: Results with 8-bit and 16-bit vectors
        run: |
          bun scripts/bench-semantic/quality.ts --model="$ZSEARCH_MODELS/embeddinggemma-2-Q8_0.gguf" --tool=dist/zsearch-embed --json=quality.json
          { echo '### Search by meaning with EmbeddingGemma 2'; echo; echo '```json'; cat quality.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Indexing time against DigUp's way
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          bun scripts/bench-semantic/bench.ts --model="$ZSEARCH_MODELS/embeddinggemma-2-Q8_0.gguf" --tool=dist/zsearch-embed --only=check,first,edit,rebuild --json=bench.json > /dev/null
          { echo '### Indexing for meaning'; echo; echo '```json'; cat bench.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: semantic-model-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            quality.json
            bench.json
          retention-days: 30
          if-no-files-found: ignore
