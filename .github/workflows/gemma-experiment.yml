name: Gemma one-off runtime experiment
# Second experiment: independent sequence attention.
on:
  push:
    branches: [codex/meaning-gemma]
    paths: [.github/workflows/gemma-experiment.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: dist/zsearch-embed
          key: zsearch-embed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/embed/**', 'scripts/build-embed.sh') }}
      - run: '[ -x dist/zsearch-embed ] || scripts/build-embed.sh'
      - run: mkdir -p work && bun scripts/bench-semantic/runtime.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gemma-runtime
          path: work/runtime.json
